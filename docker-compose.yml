services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasmim
      POSTGRES_PASSWORD: tasmim_secret
      POSTGRES_DB: tasmim_yar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasmim -d tasmim_yar"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      # توجه امنیتی: اپ با role غیر-superuser وصل می‌شود (NOBYPASSRLS)
      # تا FORCE ROW LEVEL SECURITY حتی برای owner هم اعمال شود.
      # superuser (tasmim) حتی با FORCE از RLS معاف است.
      DATABASE_URL: postgresql+psycopg://tasmim_app:tasmim_app_secret@postgres:5432/tasmim_yar
      JWT_SECRET: change-me-super-secret-jwt-key
      JWT_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
